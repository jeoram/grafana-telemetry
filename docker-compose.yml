version: '3.8'

services:
  cpp-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpp_telemetry_engine
    ports:
      - "8080:8080"
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_telemetry
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cpp-engine
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_telemetry
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/trading_telemetry.json
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./config/grafana/dashboards/trading_telemetry.json:/var/lib/grafana/dashboards/trading_telemetry.json:ro
    depends_on:
      - prometheus
    restart: always
